<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Yvonne Mukabera Portfolio</title>
    <style>
        body {
            margin: 0;
            display: grid;
            min-height: 100vh;
            place-items: center;
            background: #f6f3ec;
            color: #15201b;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        main {
            width: min(90vw, 680px);
            padding: 32px;
            border: 1px solid #d9dfd6;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(20, 32, 27, 0.12);
        }

        h1 {
            margin-top: 0;
            color: #0d493b;
        }

        code {
            display: block;
            padding: 12px;
            border-radius: 8px;
            background: #eef5f1;
            overflow-x: auto;
        }

        a {
            color: #126a52;
            font-weight: 800;
        }
    </style>
</head>
<body>
<main>
    <h1>Run this as a Spring Boot project</h1>
    <p>This file is only a reminder. The real portfolio is rendered by Spring Boot, not by opening index.html directly.</p>
    <p>In IntelliJ IDEA, open this folder and run:</p>
    <code>src/main/java/com/yvonne/portfolio/PortfolioApplication.java</code>
    <p>Then open <a href="http://localhost:8080">http://localhost:8080</a>.</p>
</main>
</body>
</html>
